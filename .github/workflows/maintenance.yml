name: صيانة

# الصيانة الدورية: فحص أسبوعي يكتشف ما تعطّل بلا أن يلمسه أحد،
# وتحديث المكتبات كل شهرين عبر Renovate (.github/renovate.json).
#
# السبب: مشروع لا يُبنى إلا حين يُنشر يكتشف عطبه يوم يحتاجه صاحبه.
# الفحص الأسبوعي ينقل الاكتشاف من لحظة الحاجة إلى لحظة الهدوء.
on:
  schedule:
    # كل سبت 03:00 بتوقيت دمشق (UTC+3) = 00:00 UTC — قبل بداية الأسبوع
    - cron: '0 0 * * 6'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  # المعرّف لاتيني لأن GitHub يرفض غيره — والاسم المعروض عربي
  check:
    name: فحص
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # لا خدمات مساعدة: القاعدة D1، وwrangler ينشئ نسخةً محلية منها
    env:
      JWT_SECRET: ci_only_secret
      NODE_ENV: development
      RATE_LIMIT_FACTOR: '100'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: فحص الأنواع
        run: pnpm turbo run typecheck

      - name: اختبارات الوحدة
        run: pnpm turbo run test

      - name: البناء الكامل
        run: pnpm run build:worker
        env:
          PUBLIC_SITE_URL: https://talisham.com

      - name: الترحيل من الصفر والبذر
        run: |
          pnpm run db:migrate:local
          pnpm run db:seed

      # الفحص على Worker حقيقي وقاعدة D1 حقيقية: البناء وحده لا يكشف
      # عطلاً في المخزون ولا في التسوية، والدورة الكاملة تكشفه.
      - name: الفحص من طرف إلى طرف
        run: |
          npx wrangler dev --port 8787 --local &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8787/api/v1/health > /dev/null && break
            sleep 3
          done
          API_BASE=http://127.0.0.1:8787/api/v1 bash scripts/e2e.sh | tee /tmp/e2e.log
          grep -q '✗' /tmp/e2e.log && { echo 'فشل فحصٌ من طرف إلى طرف'; exit 1; } || true

      - name: ميزانية الحزمة
        run: |
          JS=$(find dist-worker -maxdepth 2 -name '*.js' -not -path 'dist-worker/app/*' -not -path 'dist-worker/admin/*' -exec cat {} + 2>/dev/null | gzip -c | wc -c || echo 0)
          echo "JavaScript المضغوط في الموقع: ${JS} بايت"
          [ "$JS" -le 61440 ] || { echo "تجاوز ميزانية 60 كيلوبايت"; exit 1; }
          for app in app admin; do
            SZ=$(cat dist-worker/$app/assets/*.js | gzip -c | wc -c)
            echo "$app: ${SZ} بايت"
            [ "$SZ" -le 174080 ] || { echo "$app تجاوز 170 كيلوبايت"; exit 1; }
          done

      - name: ثغرات معروفة
        run: pnpm audit --audit-level high || echo "::warning::تدقيق الاعتماديات وجد ملاحظات"

      # الفشل الصامت أسوأ من العطل: تُفتح مسألة تُقرأ يوم الأحد
      - name: افتح مسألة عند الفشل
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `فحص الصيانة الأسبوعي فشل — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              'فشل فحص الصيانة الأسبوعي.',
              '',
              `التشغيل: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'هذا ليس عطلاً في الإنتاج بالضرورة، لكنه يعني أن المستودع لم يعد يُبنى أو يُختبر بنجاح — وإصلاحه الآن أرخص من إصلاحه يوم النشر.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'صيانة',
            });
            // مسألة واحدة مفتوحة تكفي: خمسون مسألة متطابقة تُتجاهَل كلها
            if (open.length === 0) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['صيانة'] });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            }
