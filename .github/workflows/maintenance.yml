name: صيانة

# الصيانة الدورية: فحص أسبوعي يكتشف ما تعطّل بلا أن يلمسه أحد،
# وتحديث المكتبات كل شهرين عبر Renovate (.github/renovate.json).
#
# السبب: مشروع لا يُبنى إلا حين يُنشر يكتشف عطبه يوم يحتاجه صاحبه.
# الفحص الأسبوعي ينقل الاكتشاف من لحظة الحاجة إلى لحظة الهدوء.
on:
  schedule:
    # كل سبت 03:00 بتوقيت دمشق (UTC+3) = 00:00 UTC — قبل بداية الأسبوع
    - cron: '0 0 * * 6'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  فحص:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: talisham
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    env:
      DATABASE_URL: postgresql://postgres:ci_only@localhost:5432/talisham?schema=public
      JWT_SECRET: ci_only_secret

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: فحص الأنواع
        run: pnpm turbo run typecheck

      - name: اختبارات الوحدة
        run: pnpm turbo run test

      - name: الهجرات تعمل من الصفر
        run: pnpm --filter @talisham/api exec prisma migrate deploy

      - name: البذر والقيود
        run: pnpm --filter @talisham/api run seed

      - name: البناء
        run: pnpm turbo run build

      - name: ميزانية الحزمة
        run: |
          JS=$(find apps/site/dist -name '*.js' -exec cat {} + 2>/dev/null | gzip -c | wc -c || echo 0)
          echo "JavaScript المضغوط في الموقع: ${JS} بايت"
          [ "$JS" -le 61440 ] || { echo "تجاوز ميزانية 60 كيلوبايت"; exit 1; }
          for app in app admin; do
            SZ=$(cat apps/$app/dist/assets/*.js | gzip -c | wc -c)
            echo "$app: ${SZ} بايت"
            [ "$SZ" -le 174080 ] || { echo "$app تجاوز 170 كيلوبايت"; exit 1; }
          done

      - name: ثغرات معروفة
        run: pnpm audit --audit-level high || echo "::warning::تدقيق الاعتماديات وجد ملاحظات"

      # الفشل الصامت أسوأ من العطل: تُفتح مسألة تُقرأ يوم الأحد
      - name: افتح مسألة عند الفشل
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `فحص الصيانة الأسبوعي فشل — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              'فشل فحص الصيانة الأسبوعي.',
              '',
              `التشغيل: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'هذا ليس عطلاً في الإنتاج بالضرورة، لكنه يعني أن المستودع لم يعد يُبنى أو يُختبر بنجاح — وإصلاحه الآن أرخص من إصلاحه يوم النشر.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'صيانة',
            });
            // مسألة واحدة مفتوحة تكفي: خمسون مسألة متطابقة تُتجاهَل كلها
            if (open.length === 0) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['صيانة'] });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            }
