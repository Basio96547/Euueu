name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Worker واحد يخدم الموقع والتطبيقين والواجهة البرمجية:
      # أربع نشرات منفصلة كانت تعني نطاقاً بلا مسار وصفحاتٍ ترجع 404.
      - name: بناء الأصول ونص الـWorker
        run: pnpm run build:worker
        env:
          PUBLIC_SITE_URL: https://talisham.com

      # بوابة الأداء: ميزانيات الفصل 5 مفروضة قبل النشر لا بعده
      - name: ميزانية الحزمة
        run: |
          JS=$(find dist-worker -maxdepth 2 -name '*.js' -not -path 'dist-worker/app/*' -not -path 'dist-worker/admin/*' -exec cat {} + 2>/dev/null | gzip -c | wc -c || echo 0)
          echo "JavaScript المضغوط في الموقع الساكن: ${JS} بايت"
          if [ "$JS" -gt 61440 ]; then echo "تجاوز ميزانية 60 كيلوبايت"; exit 1; fi

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
