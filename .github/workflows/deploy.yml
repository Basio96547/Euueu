name: deploy

# لا فرع اسمه main في هذا المستودع، والنشر كان معلَّقاً عليه فلم يعمل قط.
# فصار على الفرع الذي يُدفع إليه فعلاً، ويدوياً من تبويب Actions.
on:
  push:
    branches: [claude/website-remaining-plans-cjlncb]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # الترحيل قبل النشر لا بعده: نصٌّ جديد يقرأ عموداً لم يُنشأ بعدُ
      # يفشل عند أول طلب، والترتيب هنا يمنع تلك النافذة.
      #
      # ولا يُوقف النشرة إن فشل: مفتاح النشر الحالي بلا صلاحية D1
      # (`code: 7403`)، وإيقاف كل نشرة لأجل ذلك يعني موقعاً لا يُحدَّث
      # أبداً. البديل ليس تجاهلاً صامتاً: الخطوة التالية تقول ما جرى،
      # والـWorker يهيّئ قاعدته بنفسه مرة واحدة عبر `/api/v1/bootstrap`.
      # الختم قبل الترحيل: القاعدة الحيّة هُيِّئت عبر `/bootstrap` لا بـ
      # wrangler، فجداولها موجودة و`d1_migrations` فارغ. ولولا الختم
      # لبدأ الترحيل من 0001 وسقط بـ«table users already exists»، ومعه
      # كلُّ ترحيلٍ جديد إلى الأبد. والنصّ يفحص أثر كل ترحيل قبل ختمه،
      # فلا يختم ما لم يُطبَّق.
      - name: ختم سجلّ الترحيل
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/db-seal-migrations.sh --remote

      - name: ترحيل قاعدة D1
        id: migrate
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply talisham --remote

      - name: نتيجة الترحيل
        run: |
          if [ "${{ steps.migrate.outcome }}" = "failure" ]; then
            echo "::warning::تعذّر ترحيل D1 — غالباً لأن CLOUDFLARE_API_TOKEN بلا صلاحية D1:Edit."
            echo "::warning::امنح المفتاح صلاحية D1، أو هيّئ القاعدة مرة واحدة عبر POST /api/v1/bootstrap"
          else
            echo "الترحيل تمّ."
          fi

      # Worker واحد يخدم الموقع والتطبيقين والواجهة البرمجية:
      # أربع نشرات منفصلة كانت تعني نطاقاً بلا مسار وصفحاتٍ ترجع 404.
      - name: بناء الأصول ونص الـWorker
        run: pnpm run build:worker
        env:
          PUBLIC_SITE_URL: https://talisham.com

      # بوابة الأداء: ميزانيات الفصل 5 مفروضة قبل النشر لا بعده
      - name: ميزانية الحزمة
        run: |
          JS=$(find dist-worker -maxdepth 2 -name '*.js' -not -path 'dist-worker/app/*' -not -path 'dist-worker/admin/*' -exec cat {} + 2>/dev/null | gzip -c | wc -c || echo 0)
          echo "JavaScript المضغوط في الموقع الساكن: ${JS} بايت"
          if [ "$JS" -gt 61440 ]; then echo "تجاوز ميزانية 60 كيلوبايت"; exit 1; fi

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
