# تشغيل الإنتاج على خادم واحد — الفصل 11
#
# ملفٌ واحد يشغّل كل ما تحتاجه الواجهة البرمجية: القاعدة والذاكرة
# والبحث والتطبيق. المتجر الصغير لا يحتاج أكثر من هذا، والتوسّع لاحقاً
# يفصل الخدمات دون تغيير شيفرة.
#
#   cp .env.example .env   ثم املأ الأسرار
#   docker compose -f infra/docker/docker-compose.prod.yml up -d

name: talisham

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talisham}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?اضبط POSTGRES_PASSWORD في .env}
      POSTGRES_DB: ${POSTGRES_DB:-talisham}
      # الترتيب الحرفي ثابت: تغييره لاحقاً يفسد فهارس النصوص العربية
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-talisham}']
      interval: 10s
      timeout: 5s
      retries: 5
    # لا منفذ مكشوف: القاعدة تُرى من الشبكة الداخلية وحدها
    expose: ['5432']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # الحفظ على القرص مطفأ: ما فيه رموز ومهل، وفقدُه عند إعادة التشغيل
    # يعني إعادة طلب رمز لا فقدان بيانات
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    expose: ['6379']

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?اضبط MEILI_MASTER_KEY في .env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meili:/meili_data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7700/health']
      interval: 15s
      timeout: 5s
      retries: 5
    expose: ['7700']

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talisham}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-talisham}?schema=public
      REDIS_URL: redis://redis:6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET:?اضبط JWT_SECRET في .env}
      ADMIN_PHONE: ${ADMIN_PHONE:-+963900000001}
      WHATSAPP_PROVIDER_TOKEN: ${WHATSAPP_PROVIDER_TOKEN:-}
      SMS_PROVIDER_TOKEN: ${SMS_PROVIDER_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      MEDIA_PUBLIC_BASE: ${MEDIA_PUBLIC_BASE:-/media}
      NODE_ENV: production
    volumes:
      - media:/app/media
    ports:
      - '${API_PORT:-4000}:4000'

volumes:
  pgdata:
  meili:
  media:
